modid = "mielib"
book = "hexcasting:thehexbook"

resource_dirs = [  # top takes priority
    "resources",
    "{$_common.src}/main/resources",
    { path="{$_common.src}/generated/resources", required=false },
    "{$_fabric.src}/main/resources",
    { path="{$_fabric.src}/generated/resources", required=false },
    "{$_neoforge.src}/main/resources",
    { path="{$_neoforge.src}/generated/resources", required=false },
    { modid="hexcasting" },
    { modid="minecraft" },
    { modid="hexdoc" },
]
export_dir = "src/hexdoc_mielib/_export/generated"

[template]
icon = "{$_common.src}/main/resources/assets/mielib/icon.png"
include = [
    "mielib",
    "hexcasting",
    "hexdoc",
]

[template.args]
mod_name = "MieLib"
author = "xm1221"
show_landing_text = false

[extra.hexcasting]
# NOTE: "!Raw" means "don't apply variable interpolation to this value"
_pattern_regex = { "!Raw"='make\("(?P<name>[^"]+)",\s*HexDir\.(?P<startdir>\w+),\s*"(?P<signature>[qweasd]+)"' }

[[extra.hexcasting.pattern_stubs]]
path = "{$_common.kotlin}/registry/MielibActions.kt"
regex = "{^_pattern_regex}"

# platforms

[_common]
src = "../common/src"
java = "{src}/main/java/cn/xm1221/MieLib"
kotlin = "{src}/main/kotlin/cn/xm1221/MieLib"

[_fabric]
src = "../fabric/src"
java = "{src}/main/java/cn/xm1221/MieLib/fabric"
kotlin = "{src}/main/kotlin/cn/xm1221/MieLib/fabric"

[_neoforge]
src = "../neoforge/src"
java = "{src}/main/java/cn/xm1221/MieLib/neoforge"
kotlin = "{src}/main/kotlin/cn/xm1221/MieLib/neoforge"
