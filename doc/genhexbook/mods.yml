# GenHexBook mods list — the primary way to add a Hex Casting addon.
# 加附属请改这一份清单（主路径）。jar 丢进 mods-local/ 只是本地备用，进不了 CI。
#
# Schema (full write-up, 中英): docs/genhexbook.md
#   minecraft, loader (fabric), fabric_loader, fabric_installer
#   mods[]:
#     name, enabled (default true), role (library | addon, informational)
#     source: modrinth | maven | curse | url
#     modrinth: project (slug or id), version (version id or version number)
#     maven:    repo, group, artifact, version, classifier?, extension? (jar)
#     curse:    project_id, file_id   (needs the CURSEFORGE_API_KEY secret)
#     url:      url, filename?
#     filename?, sha512?, strip_nested? (modids whose nested jars are removed)
#
# strip_nested: a published addon often jar-in-jars an older MieLib. Removing that
# nested copy lets the MieLib just built from this checkout (the one with
# /genHexBook) be the copy that loads. The downloaded file is checked against
# sha512 before it is rewritten; the rewritten jar is not redistributed.
#
# Seeded from the HexCLI installer smoke set (hexcli-installer/manifest) plus MieHex.
# Versions are Modrinth version ids so a re-run does not float.

