modLoader = "kotlinforforge"
loaderVersion = "[${versions.kotlin_neoforge},)"
license = "MIT"

[[mods]]
modId = "mielib"
version = "${version}"
displayName = "MieLib"
logoFile = "assets/mielib/icon.png"
authors = "xm1221"
description = "An lib for hex-addons"

# FML 4 (NeoForge 1.21.1) does not read MixinConfigs from the manifest or fabric.mod.json;
# mixin configs must be declared here or they are never loaded. Without these, CastingVMMixin
# (the only @WrapMethod on CastingVM.executeInner) never applies and CastingVMHook -- and every
# worker registered through it, in this mod and in its dependents -- never runs.
[[mixins]]
config = "mielib-common.mixins.json"

[[mixins]]
config = "mielib-neoforge.mixins.json"

[[dependencies.mielib]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.mielib]]
modId = "minecraft"
type = "required"
versionRange = "[${versions.minecraft},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.mielib]]
modId = "kotlinforforge"
type = "required"
versionRange = "[${versions.kotlin_neoforge},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.mielib]]
modId = "architectury"
type = "required"
versionRange = "[${versions.architectury},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.mielib]]
modId = "cloth_config"
type = "required"
versionRange = "[${versions.clothConfig},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.mielib]]
modId = "hexcasting"
type = "required"
versionRange = "[${versions.hexcasting},)"
ordering = "AFTER"
side = "BOTH"
